# openlcc-sale.yaml - Verkaufsversion ohne persoenliche Spezifika.
# Separate Kopie von openlcc.yaml (Stand: 2026-09-05). Aenderungen an openlcc.yaml
# muessen hier manuell nachgezogen werden.
# Unterschied zu openlcc.yaml: kein wifi.use_address (persoenliche, feste IP
# per DHCP-Reservierung an Lars gebunden - fuer Kaeuferboards ohne Bedeutung).
# WLAN- und API-Encryption-Key kommen weiterhin aus secrets.yaml und muessen
# fuer jedes verkaufte Board individuell (frischer api_key, z.B. via
# openssl rand -base64 32) gesetzt werden, bevor geflasht wird.

external_components:
  # Lokale, gepatchte Kopie (Fix: #include "esp_random.h" fuer ESP-IDF >= 5.x,
  # Original: https://github.com/open-lcc/esphome-lcc-bianca-component)
  - source:
      type: local
      path: open-lcc/components
# Uncomment if using Acaia
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-acaia-component
# Uncomment if using Pressensor
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-pressensor-component
# Not needed for OLED build (TFT-only driver):
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-st7789v-fast
# Adding the following component will make your firmware GPL Licensed
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-stream-server

esphome:
  project:
    name: open-lcc.bianca
    version: 0.0.1
  name: smart-lcc
  name_add_mac_suffix: false
  platformio_options:
    build_flags:
      - -O2
    build_unflags:
      - -Os
      - -Werror=all
    board_build.flash_mode: dio
    board_build.partitions: "../../../open-lcc/custom_partitions.csv"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TLS_INSECURE: y
      CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY: y

psram:
  mode: octal
  speed: 80MHz

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # use_address bewusst weggelassen: das war Lars persoenliche, per
  # DHCP-Reservierung gebundene IP aus openlcc.yaml - fuer Kaeuferboards ohne
  # Bedeutung. Ohne diese Zeile laeuft ESPHome ganz normal ueber DHCP + mDNS
  # (*.local).
  # [MOD] ESPHome fährt den ESP32 sonst in einen WLAN-Sparmodus, der bei
  # schwachem Signal die Latenz hochzieht. Bei rund -90 dBm kontraproduktiv.
  power_save_mode: NONE
  # [MOD] Notzugang. captive_portal: stand schon in der Datei, ohne ap: aber
  # ohne Funktion - ESPHome warnte beim Build entsprechend. Kommt das Board
  # nicht ins konfigurierte WLAN, spannt es nach dem Timeout dieses eigene
  # Netz auf; im Browser fuehrt dann jede Adresse auf die Einrichtungsseite.
  # Fuer die Verkaufssaetze der eigentliche Zweck: der Kaeufer traegt sein
  # WLAN selbst ein, ohne die Firmware neu bauen zu muessen.
  ap:
    ssid: "Smart-LCC Setup"
    password: "openlcc123"

# Uncomment if using Acaia or Pressensor, and replace with your MAC Addresses
#ble_client:
# Uncomment for Acaia
#  - mac_address: 00:11:22:33:44:55
#    id: acaia_client
# Uncomment for Pressensor
#  - mac_address: 66:77:88:99:AA:BB
#    id: pressensor_id

# ESPHome >= 2024.2 verlangt eine explizite Plattform fuer ota:
ota:
  - platform: esphome
    on_begin:
      then:
        - open_lcc.bianca.hard_bail: lcc_1
        - delay: 3s

uart:
  baud_rate: 115200
  tx_pin: GPIO17
  rx_pin: GPIO18

esp32_ble_tracker:


# If using the Acaia integration, uncomment this

#acaia:
#  ble_client_id: acaia_client
#  id: acaia_1


# If using the Pressensor integration, uncomment this

#pressensor:
#  ble_client_id: pressensor_id

# Stream server is GPL licensed. It's very useful, but if you uncomment this, your firmware becomes GPL licensed.

stream_server:
  buffer_size: 2048

output:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        output: true
    id: rp2040_en
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        output: true
    id: rp2040_serial_boot
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        output: true
        open_drain: true
    id: rp2040_bootsel

switch:
  - platform: output
    id: rp2040_serial_boot_sw
    name: "RP2040 Serial Boot"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 120
    output: 'rp2040_serial_boot'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: output
    id: rp2040_bootsel_sw
    name: "RP2040 Bootsel"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 130
    output: 'rp2040_bootsel'
    restore_mode: ALWAYS_ON
    internal: true
  # Order matters here, enable needs to be after serial boot and bootsel
  - platform: output
    id: rp2040_en_sw
    name: "RP2040 Enable"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 140
    output: 'rp2040_en'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: open_lcc_bianca
    eco_mode:
      id: eco_mode_sw
      name: Eco Mode
      icon: "mdi:leaf"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 110
    sleep_mode:
      id: sleep_mode_sw
      name: Sleep Mode
      icon: "mdi:sleep"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 120
      # [MOD] OLED im Schlafmodus abschalten. Nicht nur Strom: ein statisches
      # Layout brennt sich auf Dauer in ein OLED ein.
      on_turn_on:
        then:
          - lambda: 'id(my_oled)->turn_off();'
      on_turn_off:
        then:
          - lambda: 'id(my_oled)->turn_on();'
    low_flow_mode:
      id: low_flow_sw
      name: Low Flow
      icon: "mdi:water-minus"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 130
  # [MOD] Praeinfusion ein/aus - reiner Merker, steuert nichts direkt
  # [MOD] Kalibrierbild: zeigt einen einzelnen Rahmen mit dem Abstand aus
  # "Calibration Inset" und diesen Wert gross in der Mitte. Damit laesst sich
  # ausmessen, welcher Teil des 128x64-Displays hinter der Gehaeuseblende
  # ueberhaupt sichtbar ist - Wert hochdrehen, bis eine Kante auftaucht.
  - platform: template
    name: "Calibration Frame"
    id: calib_sw
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"
    icon: "mdi:border-all-variant"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 4
  # [MOD] Dreht die Ausfuehrlichkeit zur Laufzeit hoch. Spart Datenverkehr
  # ueber die schwache WLAN-Strecke, solange man nicht wirklich zuschaut.
  - platform: template
    name: "Verbose Log"
    id: verbose_log
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"
    icon: "mdi:text-box-search-outline"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 5
    on_turn_on:
      - logger.set_level: DEBUG
    on_turn_off:
      - logger.set_level: WARN
  - platform: template
    name: "Pre-Infusion"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 10
    id: preinf_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:water-outline"

# Uncomment if using Pressensor
#  - platform: ble_client
#    ble_client_id: pressensor_id
#    name: "Enable Pressensor"

open_lcc_bianca:
  id: lcc_1

# [MOD] Welcher Weg die Praeinfusion faehrt
select:
  - platform: template
    name: "Pre-Infusion Mode"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 20
    id: preinf_mode
    icon: "mdi:water-sync"
    options:
      - "Firmware routine"
      - "ESP timer"
    initial_option: "Firmware routine"
    optimistic: true
    restore_value: true
    entity_category: "config"
  # [MOD] Sprache der Displaytexte. Wirkt ausschliesslich auf das OLED.
  # Die Namen der Entitaeten sind in ESPHome fest einkompiliert und lassen
  # sich zur Laufzeit nicht umschalten - die bleiben deshalb englisch und
  # werden bei Bedarf in Home Assistant selbst umbenannt.
  - platform: template
    name: "Display Language"
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 5
    id: lang_sel
    icon: "mdi:translate"
    options:
      - "English"
      - "Deutsch"
    initial_option: "English"
    optimistic: true
    restore_value: true
    entity_category: "config"

# [MOD] Eigene Zeitsteuerung: Leitungsdruck fuer N Sekunden, dann Vollfluss.
# mode: restart, damit ein zweiter Bezugsstart den alten Ablauf abloest.
script:
  - id: preinfusion
    mode: restart
    then:
      - switch.turn_on: low_flow_sw
      - delay: !lambda 'return (uint32_t)(id(preinf_time).state * 1000);'
      - switch.turn_off: low_flow_sw

logger:
  # [MOD] level ist der Compile-Filter (was ueberhaupt in der Firmware landet),
  # initial_level der Startzustand nach dem Booten. Normalbetrieb also leise,
  # ueber den Schalter "Ausfuehrliches Log" zur Laufzeit auf DEBUG hochdrehbar.
  level: DEBUG
  initial_level: WARN

# [MOD] Merker fuer den Timer-Nachlauf nach dem Bezug
globals:
  - id: brew_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [MOD] Bezugszaehler. restore_value liegt im Flash und ueberlebt Neustarts.
  # Geschrieben wird nur einmal pro Bezug - fuer den Flash unkritisch.
  - id: shots_total
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: shots_reset
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # [MOD] Nachbau der Original-Anzeige: kurzes "OK" beim Erreichen von "Warm"
  - id: was_warm
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: warm_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [MOD] Merker: war dieser Bezug ueberhaupt ein echter Bezug? Bei leerem
  # Tank sperrt die Firmware die Pumpe, der Bruehschalter meldet aber
  # weiterhin "brewing". Ohne diesen Merker liefe der Timer los und der
  # Zaehler wuerde einen Bezug buchen, der nie stattgefunden hat.
  - id: shot_valid
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: open_lcc_bianca
    status:
      id: status
      name: LCC Status
      icon: "mdi:state-machine"
      # [MOD] Nur die Flanke nach "Warm" merken. Die 15-Sekunden-Sperre
      # verhindert, dass die Meldung direkt nach jedem Neustart erscheint.
      on_value:
        - lambda: |-
            bool warm = (x == "Warm");
            if (warm && !id(was_warm) && millis() > 15000) {
              id(warm_ok_ms) = millis();
            }
            id(was_warm) = warm;
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 10
#  - platform: ble_scanner
#    name: "BLE Devices Scanner"

binary_sensor:
  - platform: template
    name: "Template Currently Brewing"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 150
    internal: true
    id: templ_brewing
    # on_press/on_release entfernt: display-Seitenumschaltung existiert nur beim TFT,
    # das OLED nutzt eine einzelne Lambda ohne pages
  - platform: open_lcc_bianca
    brewing:
      name: Currently Brewing
      icon: "mdi:coffee"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 70
      id: brewing
      # [MOD] internal entfernt - Grundlage fuer Automatisierungen in HA
      on_state:
        - binary_sensor.template.publish:
            id: templ_brewing
            state: !lambda 'return x;'
      # [MOD] Bezugsbeginn merken und ggf. Praeinfusion starten
      on_press:
        - lambda: |-
            id(brew_start_ms) = millis();
            // Bei leerem Tank laeuft die Pumpe nicht - dann ist das kein Bezug.
            id(shot_valid) = !id(water_low_sens).state;
        - if:
            condition:
              and:
                - switch.is_on: preinf_on
                - lambda: 'return id(shot_valid);'
            then:
              - if:
                  condition:
                    lambda: |-
                      // Option 0 = "Firmware-Routine". Select::state gibt es
                      // ab ESPHome 2026.8 nicht mehr, active_index() ersetzt es.
                      auto i = id(preinf_mode).active_index();
                      return i.has_value() && i.value() == 0;
                  then:
                    - open_lcc.bianca.enqueue_routine: lcc_1
                  else:
                    - script.execute: preinfusion
      # [MOD] Bezugsende: Timer-Nachlauf, Praeinfusion sicher beenden, Zaehler
      on_release:
        - lambda: 'id(brew_end_ms) = millis();'
        - if:
            condition:
              lambda: |-
                // Option 1 = "ESP-Zeit"
                auto i = id(preinf_mode).active_index();
                return i.has_value() && i.value() == 1;
            then:
              # Abbruch mitten in der Praeinfusion: immer auf Vollfluss zurueck
              - script.stop: preinfusion
              - switch.turn_off: low_flow_sw
        - lambda: |-
            uint32_t dauer = (id(brew_end_ms) - id(brew_start_ms)) / 1000;
            // shot_valid faellt weg, sobald waehrend des Bezugs der Tank
            // leer meldet - dann wurde ab da nichts mehr gefoerdert.
            if (id(shot_valid) && dauer >= (uint32_t) id(shot_min_s).state) {
              id(shots_total) += 1;
              id(shots_reset) += 1;
            }
        - component.update: shots_total_sens
        - component.update: shots_reset_sens
    filling_service_boiler:
      name: Filling Service Boiler
      icon: "mdi:water-pump"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 60
      id: filling_service_boiler_sens
      internal: true
    water_tank_low:
      name: Water Tank Low
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 100
      id: water_low_sens
      # [MOD] internal entfernt - der Wasseralarm gehoert nach Home Assistant,
      # damit man sich benachrichtigen lassen kann. device_class: problem
      # laesst ihn dort als Stoerung statt als An/Aus erscheinen.
      device_class: problem
      # [MOD] Geht der Tank mitten im Bezug leer, ist der Rest kein Bezug mehr
      on_press:
        - lambda: 'id(shot_valid) = false;'
    brew_boiler_heating:
      name: Brew Boiler Heating
      icon: "mdi:fire"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 62
      id: brew_boiler_on
      # [MOD] wieder internal: Die Firmware regelt ueber ein Tastverhaeltnis
      # (25 Zeitscheiben), der Sensor kippt deshalb im Sekundentakt. In Home
      # Assistant ist das Rauschen. Bleibt in der Weboberflaeche sichtbar und
      # versorgt weiterhin die B/S-Anzeige auf dem Display.
      device_class: heat
      internal: true
    service_boiler_heating:
      name: Service Boiler Heating
      icon: "mdi:fire"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 64
      id: service_boiler_on
      # [MOD] wieder internal - siehe Brew Boiler Heating
      device_class: heat
      internal: true
# Uncomment if using Pressensor
#  - platform: pressensor
#    connected:
#      name: Pressensor Connected
#      id: pressensor_connected
#      internal: true
# Uncomment if using Acaia
#  - platform: acaia
#    connected:
#      name: Acaia Connected
#      id: acaia_connected
#      internal: true
# Uncomment if using Stream server
  - platform: stream_server
    connected:
      name: UART Bridge connected
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 70
      internal: true
      on_press:
        then:
          - open_lcc.bianca.disable: lcc_1
      on_release:
        then:
          - open_lcc.bianca.enable: lcc_1
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - number.increment: coffee_set_point
    internal: true
    name: "Plus button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 80
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - number.decrement: coffee_set_point
    internal: true
    name: "Minus button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 90

button:
  - platform: template
    name: "Reboot RP2040 to BOOTSEL"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 110
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_bootsel_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_bootsel_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Reboot RP2040 to Serial Boot"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 100
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_serial_boot_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_serial_boot_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Enqueue Routine"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 40
    on_press:
      - open_lcc.bianca.enqueue_routine: lcc_1
  # [MOD] Nur der ruecksetzbare Zaehler, der Gesamtzaehler bleibt
  - platform: template
    name: "Reset Shot Counter"
    icon: "mdi:counter"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 40
    entity_category: "config"
    on_press:
      - lambda: 'id(shots_reset) = 0;'
      - component.update: shots_reset_sens

number:
  - platform: open_lcc_bianca
    coffee_boiler_temperature_offset:
      id: bbto
      name: Coffee Boiler Temperature Offset
      icon: "mdi:tune"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 10
      mode: box
      entity_category: "config"
    auto_sleep_after:
      id: asa
      name: Auto Sleep After
      icon: "mdi:sleep"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 20
      mode: box
      entity_category: "config"
    coffee_boiler_temperature_set_point:
      id: coffee_set_point
      name: Coffee boiler set point
      icon: "mdi:target"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 30
      mode: box
    service_boiler_temperature_set_point:
      id: service_set_point
      name: Service boiler set point
      icon: "mdi:target"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 50
      mode: box
  # [MOD] Nur fuers Kalibrierbild: Abstand des einzelnen Rahmens vom Displayrand.
  # Hochdrehen, bis eine Kante sichtbar wird - der Wert steht gross im Bild.
  - platform: template
    name: "Calibration Inset"
    icon: "mdi:arrow-expand-all"
    id: calib_inset
    min_value: 0
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: "config"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
  # [MOD] Dauer der Praeinfusion, nur im Modus "ESP-Zeit" wirksam
  - platform: template
    name: "Pre-Infusion Time"
    icon: "mdi:timer-outline"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 30
    id: preinf_time
    min_value: 0
    max_value: 15
    step: 0.5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: "config"
  # [MOD] Ab dieser Bezugsdauer zaehlt ein Bezug - haelt Spuelgaenge draussen
  - platform: template
    name: "Minimum Shot Duration"
    icon: "mdi:timer-cog-outline"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 30
    id: shot_min_s
    min_value: 0
    max_value: 20
    step: 1
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: "config"

sensor:
  - platform: open_lcc_bianca
    coffee_boiler_temperature:
      name: Coffee Boiler Temperature
      icon: "mdi:coffee-maker"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 20
      id: coffee_boiler_sens
    service_boiler_temperature:
      name: Service Boiler Temperature
      icon: "mdi:kettle-steam"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 40
      id: service_boiler_sens
    external_temperature_1:
      name: E61 Outlet Temperature
      icon: "mdi:thermometer"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 40
      id: outlet_temp_sens
      # [MOD] internal: ohne MCP9600-Wandler stehen beide dauerhaft auf 0.
      # Bleiben in der Weboberfläche unter Diagnose sichtbar, tauchen aber
      # nicht mehr in Home Assistant auf.
      internal: true
    external_temperature_2:
      name: E61 Inlet Temperature
      icon: "mdi:thermometer"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 50
      id: inlet_temp_sens
      internal: true
    auto_sleep_in:
      name: Auto-sleep in
      icon: "mdi:timer-sand"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 30
      unit_of_measurement: "min"
      accuracy_decimals: 0
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    current_routine:
      name: Currently Loaded Routine ID
      icon: "mdi:script-text-play"
      web_server:
        sorting_group_id: grp_preinf
        sorting_weight: 50
    current_routine_step:
      name: Current Routine Step
      icon: "mdi:debug-step-over"
      web_server:
        sorting_group_id: grp_preinf
        sorting_weight: 60
    rp2040_uptime:
      id: rp2040_up
      name: RP2040 Uptime
      icon: "mdi:timer-outline"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 20
      unit_of_measurement: "min"
      accuracy_decimals: 0
      entity_category: "diagnostic"
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    brew_time:
      name: Brew time
      icon: "mdi:timer-outline"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 60
      id: brew_time
