# SSD1306

# (color: white/black already defined in the main color: block above, no need to redefine)

# [MOD] Komplett neues OLED-Layout.
# Sichtbares Fenster im Bianca-Gehaeuse: etwa x 16..105, y 16..53.
# Alles ausserhalb davon wird vom Gehaeuse verdeckt - deshalb der Offset von 16/16.
display:
  - platform: ssd1306_spi
    id: my_oled          # [MOD] noetig, um das Panel im Schlafmodus abzuschalten
    update_interval: 0.5s
    model: "SSD1306 128x64"
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    rotation: 180°
    lambda: |-
      // Sichtfenster am 05.09.2026 mit dem Kalibrierbild ausgemessen:
      //   x 15..110, y 14..63  (96 x 50 Pixel)
      // Innenrand 2 px ringsum  ->  Inhaltsbereich x 17..108, y 16..61.
      // Alle Koordinaten unten beziehen sich darauf.

      if (id(calib_sw).state) {
        int n = (int) id(calib_inset).state;
        it.rectangle(n, n, 128 - 2 * n, 64 - 2 * n);
        it.printf(64, 40, id(font_num), TextAlign::BASELINE_CENTER, "%d", n);
        return;
      }

      // [MOD] Der Bruehschalter meldet auch dann "brewing", wenn die Firmware
      // die Pumpe wegen leerem Tank gar nicht anlaufen laesst. Der Timer haengt
      // deshalb an shot_valid, nicht am rohen Schaltersignal - sonst zaehlt er
      // bei einem Pruefvorgang mit leerem Tank munter hoch.
      bool show_timer = (id(brewing).state && !id(water_low_sens).state) ||
                        (id(shot_valid) && id(brew_end_ms) > 0 &&
                         (millis() - id(brew_end_ms)) < 5000);
      bool show_ok = !show_timer && id(warm_ok_ms) > 0 &&
                     (millis() - id(warm_ok_ms)) < 2000;
      bool warm = (id(status).state == "Warm");

      // [MOD] Sprache der Displaytexte. Index 0 = English, 1 = Deutsch.
      // active_index() liefert ein optional; faellt im Zweifel auf Englisch
      // zurueck, damit nie ein leerer Text stehen bleibt.
      auto li = id(lang_sel).active_index();
      bool de = li.has_value() && li.value() == 1;

      if (show_ok) {
        // Aufheizen fertig: gleiche Bildsprache wie beim Bezug, Tasse ohne Dampf
        it.print(17, 16, id(font1), de ? "BEREIT" : "READY");
        it.printf(108, 16, id(font1), TextAlign::TOP_RIGHT, "%.1f°", id(coffee_boiler_sens).state);
        it.image(17, 27, id(cup_still), id(white), id(black));
        it.print(79, 55, id(font_timer), TextAlign::BASELINE_CENTER, "OK");

      } else if (show_timer) {
        // Bezug: Tasse wechselt zwischen den beiden Dampf-Frames
        it.printf(17, 16, id(font1), "%.1f°", id(coffee_boiler_sens).state);
        it.print(108, 16, id(font1), TextAlign::TOP_RIGHT, de ? "SEK" : "SEC");
        // Tasse (32 px hoch) mittig im Bereich unter der Kopfzeile: 24..61
        // ergibt Oberkante 27. Die Sekunden sitzen auf derselben Mittellinie
        // und werden im Feld rechts der Tasse zentriert - so springt die
        // Zahl nicht, wenn sie von einer auf zwei Stellen wechselt.
        if (((millis() / 430) % 2) == 0) {
          it.image(17, 27, id(cup_steam_a), id(white), id(black));
        } else {
          it.image(17, 27, id(cup_steam_b), id(white), id(black));
        }
        it.printf(79, 55, id(font_timer), TextAlign::BASELINE_CENTER, "%.0f", id(brew_time).state);

      } else {
        // Kopfzeile: Status links, Zustandssymbole rechts - nur wenn sie etwas
        // bedeuten. rx wandert von rechts nach links, damit keine Luecken entstehen.
        // Der Rohtext der Firmware ist zu lang: "Temperatures normalizing"
        // waeren 24 Zeichen x 6 px = 144 px, das Fenster hat nur 96.
        // Deshalb Kurzformen. Laengster Text ist "First run" mit 9 Zeichen
        // = 54 px, endet bei x 71; das erste Symbol beginnt fruehestens
        // bei x 80. Bis 16 Zeichen bliebe es kollisionsfrei zur rechten Kante.
        // "Warm" ist der Rohtext der Firmware; angezeigt wird "Ready", weil
        // das der tatsaechliche Zustand ist - die Maschine ist bezugsbereit.
        const char *st = "?";
        std::string lcc = id(status).state;
        if      (lcc == "Warm")                     st = de ? "Bereit" : "Ready";
        else if (lcc == "Heatup")                   st = de ? "Heizt"  : "Heating";
        else if (lcc == "Temperatures normalizing") st = de ? "Regelt" : "Settling";
        else if (lcc == "Sleeping")                 st = de ? "Schlaf" : "Sleep";
        else if (lcc == "Bailed")                   st = "STOP";
        else if (lcc == "First run")                st = de ? "Start"  : "First run";
        it.print(17, 16, id(font1), st);
        int rx = 108;
        if (id(brew_boiler_on).state) {
          it.image(rx - 6, 17, id(bssr_1x), id(white), id(black));
          rx -= 10;
        } else if (id(service_boiler_on).state) {
          it.image(rx - 6, 17, id(sssr_1x), id(white), id(black));
          rx -= 10;
        }
        if (id(filling_service_boiler_sens).state) {
          it.image(rx - 7, 16, id(pump_1x), id(white), id(black));
        }
        // Das 8x8-Wassersymbol in der Kopfzeile entfaellt - bei leerem Tank
        // steht die Warnung gross im Mittelfeld und muss nicht doppelt da sein.

        if (id(water_low_sens).state) {
          // Wassertank leer: die grosse Temperatur weicht der Warnung.
          // 16x16-Symbol (no_water_2x) statt der 8x8-Variante, daneben das Wort.
          // Die Breite des Wortes wird nicht geschaetzt, sondern gemessen -
          // "WASSER" ist deutlich breiter als "WATER", und eine feste
          // x-Position waere fuer eines von beiden immer falsch.
          const char *wtxt = de ? "WASSER" : "WATER";
          int tx, ty, tw, th;
          it.get_text_bounds(0, 0, wtxt, id(font_warn), TextAlign::BASELINE_LEFT,
                             &tx, &ty, &tw, &th);
          const int gap = 6;
          int bx = 17 + (92 - (16 + gap + tw)) / 2;   // Block waagerecht zentrieren
          if (bx < 17) bx = 17;                       // Notbremse, falls doch zu breit
          // Senkrecht: Symbol 31..46, Grundlinie 44 - beide Mitten liegen bei 39
          it.image(bx, 31, id(no_water), id(white), id(black));
          it.print(bx + 16 + gap, 44, id(font_warn), TextAlign::BASELINE_LEFT, wtxt);
          // Fusszeile links: jetzt der Istwert - der Sollwert hilft nicht,
          // solange ohnehin nicht gebrueht werden kann.
          it.printf(17, 55, id(font1), "%.1f°", id(coffee_boiler_sens).state);

        } else {
          // Brühtemperatur gross. Grundlinie 50 zentriert die rund 21 px hohen
          // Ziffern im Feld 23..54 zwischen Kopf- und Fusszeile.
          it.printf(17, 50, id(font_num), TextAlign::BASELINE_LEFT, "%.1f°",
                    id(coffee_boiler_sens).state);

          // Fusszeile: links der Sollwert - direkt unter seinem Istwert, deshalb
          // ohne Beschriftung. Blinkt im Sekundentakt, solange nicht "Warm".
          if (warm || ((millis() / 1000) % 2) == 0) {
            it.printf(17, 55, id(font1), "%.1f", id(coffee_set_point).state);
          }
        }
        // Rechts der Dampfkessel, im Eco-Modus stattdessen der Hinweis
        if (id(eco_mode_sw).state) {
          it.print(108, 55, id(font1), TextAlign::TOP_RIGHT, "Eco");
        } else {
          it.printf(108, 55, id(font1), TextAlign::TOP_RIGHT, "S %.0f°",
                    id(service_boiler_sens).state);
        }
      }
