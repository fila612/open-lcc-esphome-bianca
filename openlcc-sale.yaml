# Enable Home Assistant API
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

captive_portal:

web_server:
  port: 80
  ota: false # Not available in IDF
  log: true          # [MOD] Log-Spalte rechts, per Doppelklick ein-/ausblendbar
  include_internal: true
  # [MOD] Version 3 statt der Vorgabe 2: Karten-Layout mit Gruppen statt
  # einer alphabetisch sortierten Tabelle. sorting_groups gibt es nur in v3.
  version: 3
  # [MOD] Gruppennamen englisch - wie alle Entitaetsnamen. Die IDs bleiben
  # deutsch, die sind rein intern und tauchen nirgends in der Oberflaeche auf.
  sorting_groups:
    - id: grp_betrieb
      name: "Operation"
      sorting_weight: 10
    - id: grp_preinf
      name: "Pre-Infusion"
      sorting_weight: 20
    - id: grp_zaehler
      name: "Shot Counter"
      sorting_weight: 30
    - id: grp_config
      name: "Settings"
      sorting_weight: 40
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 50

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

i2c:
  sda: 2
  scl: 1
  scan: true
  id: qwiic_3

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: dark_gray
    red: 20%
    green: 20%
    blue: 20%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: white
    red: 100%
    green: 100%
    blue: 100%
  - id: black
    red: 0%
    green: 0%
    blue: 0%
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font12
    size: 24
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font36
    size: 48
  - file: "open-lcc/9x15.bdf"
    id: font2
  - file: "open-lcc/5x7.bdf"
    id: font1
  # [MOD] Grosse Ziffern fuers OLED. Roboto rendert Ziffern ca. 0,7 x Schriftgroesse hoch.
  #       glyphs begrenzt den Zeichensatz und spart Flash.
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_num
    size: 30
    glyphs: "0123456789.-°"
  - file:
      type: gfonts
      family: Roboto
      # [MOD] Gewicht 400 statt 900: Roboto Black wirkte auf dem kleinen
      # Display zu massig. Groesse 34 reicht fuers gemessene Fenster.
      weight: 400
    id: font_timer
    size: 34
    glyphs: "0123456789.OK"
  # [MOD] Mittelgrosse Versalien fuer die Wasserwarnung. Groesse 14 ist
  # bewusst konservativ: "WASSER" braucht damit rund 59 px, das Feld rechts
  # neben dem 16x16-Symbol hat 69. glyphs enthaelt nur die sechs Buchstaben,
  # die in "WATER" und "WASSER" vorkommen.
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_warn
    size: 14
    glyphs: "AERSTW"


# ESPHome >= 2025 verlangt 'type:' pro Bild; BINARY = 1-bit, passend fuer Mono-OLED
image:
  - file: "open-lcc/xbm/pump_on_2x.h"
    id: pump_on
    type: BINARY
  # [MOD] 8x8-Varianten fuers OLED - die 2x-Bilder (16x16) waren fuers TFT
  #       und ueberlappen sich im kleinen Sichtfenster
  - file: "open-lcc/xbm/pump_on.h"
    id: pump_1x
    type: BINARY
  # [MOD] Kaffeetasse, 32x32. cup_steam_a/b sind die zwei Dampf-Frames,
  # zwischen denen beim Bezug gewechselt wird.
  - file: "open-lcc/xbm/cup_no_smoke.h"
    id: cup_still
    type: BINARY
  - file: "open-lcc/xbm/cup_smoke_1.h"
    id: cup_steam_a
    type: BINARY
  - file: "open-lcc/xbm/cup_smoke_2.h"
    id: cup_steam_b
    type: BINARY
  # [MOD] Kesselsymbole 7x7 statt der Buchstaben B und S
  - file: "open-lcc/xbm/bssr_on.h"
    id: bssr_1x
    type: BINARY
  - file: "open-lcc/xbm/sssr_on.h"
    id: sssr_1x
    type: BINARY
  - file: "open-lcc/xbm/no_water.h"
    id: no_water_1x
    type: BINARY
  - file: "open-lcc/xbm/no_water_2x.h"
    id: no_water
    type: BINARY
  - file: "open-lcc/xbm/eco_mode_2x.h"
    id: eco_mode
    type: BINARY
  - file: "open-lcc/xbm/bssr_on_2x.h"
    id: bssr_on
    type: BINARY
  - file: "open-lcc/xbm/sssr_on_2x.h"
    id: sssr_on
    type: BINARY

