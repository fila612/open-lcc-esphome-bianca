# openlcc-template.yaml - generic build without personal/site-specific settings,
# a starting point for any board this firmware runs on.
# DERIVED FILE: generated 1:1 from openlcc.yaml (state: 2026-09-07); it differs
# only in this header, in name_add_mac_suffix and in the missing
# wifi.use_address. Do not edit directly - changes belong in openlcc.yaml and
# are derived from there again.
#
# Per board, before flashing:
#   - a fresh API encryption key (e.g. openssl rand -base64 32) in secrets.yaml
#   - the buyer's WiFi credentials, or let the buyer enter them through the
#     "Smart-LCC Setup" access point

external_components:
  # Local, patched copy (fix: #include "esp_random.h" for ESP-IDF >= 5.x,
  # Original: https://github.com/open-lcc/esphome-lcc-bianca-component)
  - source:
      type: local
      path: open-lcc/components
# Uncomment if using Acaia
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-acaia-component
# Uncomment if using Pressensor
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-pressensor-component
# Not needed for OLED build (TFT-only driver):
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-st7789v-fast
# Adding the following component will make your firmware GPL Licensed
#  - source:
#      type: git
#      url: https://github.com/open-lcc/esphome-stream-server

esphome:
  project:
    name: open-lcc.bianca
    # [MOD] Own versioning starts here. 0.0.1 was the untouched upstream state.
    # 1.0 is reached once the original LCC's functions are fully reproduced
    # AND confirmed on the machine.
    version: 0.9.0
  name: smart-lcc
  # [MOD] Unlike the personal build this appends the MAC suffix, so several
  # boards can run on the same network without colliding on hostname and mDNS.
  name_add_mac_suffix: true
  platformio_options:
    build_flags:
      - -O2
    build_unflags:
      - -Os
      - -Werror=all
    board_build.flash_mode: dio
    board_build.partitions: "../../../open-lcc/custom_partitions.csv"
  # [MOD] Compute the visible menu entries once at boot.
  on_boot:
    priority: -100
    then:
      - script.execute: menu_rebuild

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TLS_INSECURE: y
      CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY: y

psram:
  mode: octal
  speed: 80MHz

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # use_address is deliberately left out: that was the personal, DHCP-reserved
  # address from openlcc.yaml and means nothing on a buyer's board. Without the
  # line ESPHome simply uses DHCP plus mDNS (*.local).
  # [MOD] Otherwise ESPHome puts the ESP32 into a WiFi power-save mode that
  # raises latency on a weak signal. Counterproductive at around -90 dBm.
  power_save_mode: NONE
  # [MOD] Fallback access. captive_portal: was already in the file, but
  # without ap: it had no effect - ESPHome warned about it at build time. If
  # the board cannot join the configured WiFi it opens this network of its
  # own after the timeout; in a browser every address then leads to the setup
  # page. That is the real purpose for the boards being sold: the buyer
  # enters their own WiFi without having to rebuild the firmware.
  ap:
    ssid: "Smart-LCC Setup"
    password: "openlcc123"

# Uncomment if using Acaia or Pressensor, and replace with your MAC Addresses
#ble_client:
# Uncomment for Acaia
#  - mac_address: 00:11:22:33:44:55
#    id: acaia_client
# Uncomment for Pressensor
#  - mac_address: 66:77:88:99:AA:BB
#    id: pressensor_id

# ESPHome >= 2024.2 requires an explicit platform for ota:
ota:
  - platform: esphome
    on_begin:
      then:
        - open_lcc.bianca.hard_bail: lcc_1
        - delay: 3s

uart:
  baud_rate: 115200
  tx_pin: GPIO17
  rx_pin: GPIO18

esp32_ble_tracker:


# If using the Acaia integration, uncomment this

#acaia:
#  ble_client_id: acaia_client
#  id: acaia_1


# If using the Pressensor integration, uncomment this

#pressensor:
#  ble_client_id: pressensor_id

# Stream server is GPL licensed. It's very useful, but if you uncomment this, your firmware becomes GPL licensed.

stream_server:
  buffer_size: 2048

output:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        output: true
    id: rp2040_en
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        output: true
    id: rp2040_serial_boot
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        output: true
        open_drain: true
    id: rp2040_bootsel

switch:
  - platform: output
    id: rp2040_serial_boot_sw
    name: "RP2040 Serial Boot"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 120
    output: 'rp2040_serial_boot'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: output
    id: rp2040_bootsel_sw
    name: "RP2040 Bootsel"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 130
    output: 'rp2040_bootsel'
    restore_mode: ALWAYS_ON
    internal: true
  # Order matters here, enable needs to be after serial boot and bootsel
  - platform: output
    id: rp2040_en_sw
    name: "RP2040 Enable"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 140
    output: 'rp2040_en'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: open_lcc_bianca
    eco_mode:
      id: eco_mode_sw
      name: Eco Mode
      icon: "mdi:leaf"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 110
    sleep_mode:
      id: sleep_mode_sw
      name: Sleep Mode
      icon: "mdi:sleep"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 120
      # [MOD] Turn the OLED off in sleep mode. Not just power: a static
      # layout burns into an OLED over time.
      on_turn_on:
        then:
          - lambda: 'id(my_oled)->turn_off();'
      on_turn_off:
        then:
          - lambda: 'id(my_oled)->turn_on();'
    low_flow_mode:
      id: low_flow_sw
      name: Low Flow
      icon: "mdi:water-minus"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 130
  # [MOD] Pre-infusion on/off - a plain flag, it controls nothing directly
  # [MOD] Calibration frame: draws a single rectangle inset by "Calibration
  # Inset" and shows that value large in the middle. Use it to measure which
  # part of the 128x64 display is actually visible behind the case bezel -
  # raise the value until an edge appears.
  - platform: template
    name: "Calibration Frame"
    id: calib_sw
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"
    icon: "mdi:border-all-variant"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 4
  # [MOD] Raises log verbosity at runtime. Saves traffic over the weak WiFi
  # link as long as nobody is actually watching.
  - platform: template
    name: "Verbose Log"
    id: verbose_log
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: "config"
    icon: "mdi:text-box-search-outline"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 5
    on_turn_on:
      - logger.set_level: DEBUG
    on_turn_off:
      - logger.set_level: WARN
  - platform: template
    name: "Pre-Infusion"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 10
    id: preinf_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:water-outline"
  # [MOD] Visibility of the pages in the button menu. Only these six switches
  # decide what appears when paging on the machine - "Back" is always
  # there. All can be on for the boards being sold; here, less is enough.
  - platform: template
    name: "Menu: Pre-Infusion"
    id: menu_show_preinf
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:water-outline"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 10
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild
  - platform: template
    name: "Menu: Steam Set Point"
    id: menu_show_steam
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:kettle-steam-outline"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 20
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild
  - platform: template
    name: "Menu: Eco Mode"
    id: menu_show_eco
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:leaf"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 30
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild
  - platform: template
    name: "Menu: Language"
    id: menu_show_lang
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:translate"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 40
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild
  - platform: template
    name: "Menu: Shot Counter"
    id: menu_show_shots
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:counter"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 50
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild
  - platform: template
    name: "Menu: Sleep Mode"
    id: menu_show_sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    icon: "mdi:sleep"
    web_server:
      sorting_group_id: grp_menu
      sorting_weight: 60
    on_turn_on:
      - script.execute: menu_rebuild
    on_turn_off:
      - script.execute: menu_rebuild

# Uncomment if using Pressensor
#  - platform: ble_client
#    ble_client_id: pressensor_id
#    name: "Enable Pressensor"

open_lcc_bianca:
  id: lcc_1

# [MOD] Which path the pre-infusion takes
select:
  - platform: template
    name: "Pre-Infusion Mode"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 20
    id: preinf_mode
    icon: "mdi:water-sync"
    # [MOD] The order is binding: index 0 = fixed times from the RP2040
    # firmware (4 s / 10 s), index 1 = the two menu values.
    # Shown as "Vorgabe"/"Eigene" on the OLED, English here like all entities.
    options:
      - "Preset"
      - "Custom"
    # [MOD] New devices start adjustable - otherwise the menu values would
    # only take effect for the buyer after switching. Existing choice is kept.
    initial_option: "Custom"
    optimistic: true
    restore_value: true
    entity_category: "config"
  # [MOD] Language of the display texts. Affects the OLED only.
  # Entity names are compiled into ESPHome and cannot be switched at
  # runtime - they stay English and get renamed in Home Assistant
  # if needed.
  - platform: template
    name: "Display Language"
    web_server:
      sorting_group_id: grp_config
      sorting_weight: 5
    id: lang_sel
    icon: "mdi:translate"
    options:
      - "English"
      - "Deutsch"
    initial_option: "English"
    optimistic: true
    restore_value: true
    entity_category: "config"

# [MOD] Rebuild of the original pre-infusion: build pressure first, then pump
# off, then carry on until the lever closes. preinf_press_time is the first
# phase, preinf_time the pause. On the tank "low_flow_sw on" is a real
# standstill - the switch sends PUMP_OFF_SOLENOID_OPEN, and without a mains
# water line no pressure stands at that open valve. mode: restart so a
# second brew start replaces the sequence still running.
script:
  - id: preinfusion
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(preinf_press_time).state * 1000);'
      - switch.turn_on: low_flow_sw
      - delay: !lambda 'return (uint32_t)(id(preinf_time).state * 1000);'
      - switch.turn_off: low_flow_sw

  # [MOD] Visible menu entries as a bitmask. The switch -> entry mapping
  # lives here and nowhere else; display and button logic only test bits.
  # Bit 6 ("Back") is always set, otherwise the timeout would be the only
  # way out. If the entry in view gets hidden, the display jumps to
  # "Back".
  - id: menu_rebuild
    then:
      - lambda: |-
          uint16_t m = 0;
          if (id(menu_show_preinf).state) m |= (1 << 0);
          if (id(menu_show_steam).state)  m |= (1 << 1);
          if (id(menu_show_eco).state)    m |= (1 << 2);
          if (id(menu_show_lang).state)   m |= (1 << 3);
          if (id(menu_show_shots).state)  m |= (1 << 4);
          if (id(menu_show_sleep).state)  m |= (1 << 5);
          m |= (1 << 6);
          id(menu_mask) = m;
          if (id(ui_level) == 0 && !((m >> id(ui_page)) & 1)) id(ui_page) = 6;

  # [MOD] Short press inside the menu: page (state 1) or change a value
  # (state 2). Normal operation deliberately does not pass through here but
  # goes straight to number.increment/decrement - that way the step size
  # stays the entity's own instead of one hardcoded here.
  - id: ui_short
    parameters:
      dir: int
    then:
      - lambda: |-
          id(ui_last_ms) = millis();
          if (id(ui_state) == 1) {
            if (id(ui_level) != 0) {          // submenus: fixed page count
              uint8_t n = (id(ui_level) == 1) ? 5 : 3;
              id(ui_page) = (uint8_t) ((id(ui_page) + dir + n) % n);
              return;
            }
            int p = id(ui_page);              // top level: skip hidden entries
            for (int i = 0; i < 7; i++) {
              p = (p + dir + 7) % 7;
              if ((id(menu_mask) >> p) & 1) break;
            }
            id(ui_page) = (uint8_t) p;
            return;
          }
          if (id(ui_state) != 2) return;
          // Whole seconds like the original, even though the entity allows 0.5.
          if (id(ui_level) == 1 && id(ui_page) == 2) {
            float v = roundf(id(preinf_press_time).state) + dir;
            if (v < 0) v = 0;
            if (v > 15) v = 15;
            auto c = id(preinf_press_time).make_call();
            c.set_value(v);
            c.perform();
          } else if (id(ui_level) == 1 && id(ui_page) == 3) {
            float v = roundf(id(preinf_time).state) + dir;
            if (v < 0) v = 0;
            if (v > 15) v = 15;
            auto c = id(preinf_time).make_call();
            c.set_value(v);
            c.perform();
          } else if (id(ui_level) == 0 && id(ui_page) == 1) {
            // Without a reported reading do nothing, rather than moving the steam
            // boiler from a guessed starting point.
            float cur = id(service_set_point).state;
            if (std::isnan(cur)) return;
            auto c = id(service_set_point).make_call();
            c.set_value(roundf(cur) + dir);
            c.perform();
          } else if (id(ui_level) == 2 && id(ui_page) == 1) {
            // Auto-sleep goes up to 600 minutes - single steps would be
            // unusable, so five per press. 0 means "off".
            // Without a reported reading start at 0 instead of computing with NaN -
            // set_value(NaN) would be discarded without a word.
            float cur = id(asa).state;
            if (std::isnan(cur)) cur = 0;
            float v = roundf(cur) + 5 * dir;
            if (v < 0) v = 0;
            if (v > 600) v = 600;
            auto c = id(asa).make_call();
            c.set_value(v);
            c.perform();
          }

  # [MOD] Long press: open the menu, trigger an entry, confirm a value or
  # close - depending on state and page.
  - id: ui_long
    then:
      - lambda: |-
          id(ui_last_ms) = millis();
          if (id(ui_state) == 0) {
            int p = 0;
            for (int i = 0; i < 7; i++) {
              if ((id(menu_mask) >> p) & 1) break;
              p = (p + 1) % 7;
            }
            id(ui_page) = (uint8_t) p;
            id(ui_level) = 0;
            id(ui_state) = 1;
            return;
          }
          if (id(ui_state) == 2) { id(ui_state) = 1; return; }
          if (id(ui_level) == 1) {          // pre-infusion submenu
            switch (id(ui_page)) {
              case 0: id(preinf_on).toggle(); break;
              case 1: {                     // Modus umschalten
                auto c = id(preinf_mode).make_call();
                c.select_next(true);
                c.perform();
                break;
              }
              case 2:
              case 3: id(ui_state) = 2; break;
              default:                      // "Back": one level up
                id(ui_level) = 0;
                id(ui_page) = 0;
                break;
            }
            return;
          }
          if (id(ui_level) == 2) {          // Untermenue Schlafmodus
            switch (id(ui_page)) {
              case 0: id(sleep_mode_sw).toggle(); break;
              case 1: id(ui_state) = 2; break;
              default:
                id(ui_level) = 0;
                id(ui_page) = 5;
                break;
            }
            return;
          }
          switch (id(ui_page)) {
            case 0:                         // Pre-infusion: one level deeper
              id(ui_level) = 1;
              id(ui_page) = 0;
              break;
            case 1: id(ui_state) = 2; break;
            case 2: id(eco_mode_sw).toggle(); break;
            case 3: {
              auto c = id(lang_sel).make_call();
              c.select_next(true);
              c.perform();
              break;
            }
            case 4: id(shots_reset) = 0; break;
            case 5:                         // Sleep: one level deeper
              id(ui_level) = 2;
              id(ui_page) = 0;
              break;
            default: id(ui_state) = 0; break;
          }

# [MOD] Two ways out of the menu: eight seconds without a button press, and
# a starting brew - then the display belongs to the shot timer.
interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (id(ui_state) == 0) return;
          if (id(brewing).state || (millis() - id(ui_last_ms)) > 8000) {
            id(ui_state) = 0;
            id(ui_level) = 0;
          }

logger:
  # [MOD] level is the compile-time filter (what ends up in the firmware at
  # all), initial_level the state after boot. Quiet in normal operation,
  # raise it to DEBUG at runtime with the "Verbose Log" switch.
  level: DEBUG
  initial_level: WARN

# [MOD] Flag for the timer run-on after a brew
globals:
  # [MOD] Button menu: 0 = normal operation, 1 = paging, 2 = editing a value.
  - id: ui_state
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # [MOD] Level: 0 = main menu, 1 = pre-infusion submenu, 2 = sleep submenu
  - id: ui_level
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ui_page
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ui_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [MOD] Bitmask of the visible entries, set by menu_rebuild.
  # Every bit set until boot has evaluated the switches.
  - id: menu_mask
    type: uint16_t
    restore_value: no
    initial_value: '511'
  - id: brew_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: brew_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [MOD] Shot counters. restore_value lives in flash and survives reboots.
  # Written once per brew - uncritical for the flash.
  - id: shots_total
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: shots_reset
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # [MOD] Rebuild of the original display: a brief "OK" on reaching "Warm"
  - id: was_warm
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: warm_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # [MOD] Flag: was this brew a real brew at all? With an empty tank the
  # firmware blocks the pump, but the brew switch keeps reporting "brewing".
  # Without this flag the timer would start and the counter would book a
  # brew that never happened.
  - id: shot_valid
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: open_lcc_bianca
    status:
      id: status
      name: LCC Status
      icon: "mdi:state-machine"
      # [MOD] Only remember the edge into "Warm". The 15-second lockout
      # keeps the message from appearing right after every reboot.
      on_value:
        - lambda: |-
            bool warm = (x == "Warm");
            if (warm && !id(was_warm) && millis() > 15000) {
              id(warm_ok_ms) = millis();
            }
            id(was_warm) = warm;
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 10
#  - platform: ble_scanner
#    name: "BLE Devices Scanner"

binary_sensor:
  # [MOD] The internal mirror "Template Currently Brewing" is gone: it came
  # from the TFT page switching, was never read anywhere and sat confusingly
  # next to the real sensor in the web interface.
  - platform: open_lcc_bianca
    brewing:
      name: Currently Brewing
      icon: "mdi:coffee"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 70
      id: brewing
      # [MOD] internal removed - basis for automations in Home Assistant
      # [MOD] Remember the brew start and start pre-infusion if enabled
      on_press:
        - lambda: |-
            id(brew_start_ms) = millis();
            // With an empty tank the pump does not run - then it is not a brew.
            id(shot_valid) = !id(water_low_sens).state;
        - if:
            condition:
              and:
                - switch.is_on: preinf_on
                - lambda: 'return id(shot_valid);'
            then:
              - if:
                  condition:
                    lambda: |-
                      // Option 0 = "Preset" (fixed times in the RP2040 firmware).
                      // Select::state is gone since ESPHome 2026.8, active_index() replaces it.
                      auto i = id(preinf_mode).active_index();
                      return i.has_value() && i.value() == 0;
                  then:
                    - open_lcc.bianca.enqueue_routine: lcc_1
                  else:
                    - script.execute: preinfusion
      # [MOD] Brew end: timer run-on, stop pre-infusion safely, count the shot
      on_release:
        - lambda: 'id(brew_end_ms) = millis();'
        - if:
            condition:
              lambda: |-
                // Option 1 = "Custom" (the two menu values)
                auto i = id(preinf_mode).active_index();
                return i.has_value() && i.value() == 1;
            then:
              # Aborted mid pre-infusion: always fall back to full flow
              - script.stop: preinfusion
              - switch.turn_off: low_flow_sw
        - lambda: |-
            uint32_t dauer = (id(brew_end_ms) - id(brew_start_ms)) / 1000;
            // shot_valid drops as soon as the tank reports empty during the brew -
            // from that point on nothing was being pumped any more.
            if (id(shot_valid) && dauer >= (uint32_t) id(shot_min_s).state) {
              id(shots_total) += 1;
              id(shots_reset) += 1;
            }
        - component.update: shots_total_sens
        - component.update: shots_reset_sens
    filling_service_boiler:
      name: Filling Service Boiler
      icon: "mdi:water-pump"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 60
      id: filling_service_boiler_sens
      internal: true
    water_tank_low:
      name: Water Tank Low
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 100
      id: water_low_sens
      # [MOD] internal removed - the water alarm belongs in Home Assistant so
      # you can get notified. device_class: problem makes it appear there as
      # a fault rather than a plain on/off.
      device_class: problem
      # [MOD] If the tank runs dry mid-brew, the rest is no longer a brew
      on_press:
        - lambda: 'id(shot_valid) = false;'
    brew_boiler_heating:
      name: Brew Boiler Heating
      icon: "mdi:fire"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 62
      id: brew_boiler_on
      # [MOD] internal again: the firmware controls via a duty cycle (25 time
      # slices), so the sensor toggles every second. In Home Assistant that is
      # noise. It stays visible in the web interface and still feeds the B/S
      # indicator on the display.
      device_class: heat
      internal: true
    service_boiler_heating:
      name: Service Boiler Heating
      icon: "mdi:fire"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 64
      id: service_boiler_on
      # [MOD] wieder internal - siehe Brew Boiler Heating
      device_class: heat
      internal: true
# Uncomment if using Pressensor
#  - platform: pressensor
#    connected:
#      name: Pressensor Connected
#      id: pressensor_connected
#      internal: true
# Uncomment if using Acaia
#  - platform: acaia
#    connected:
#      name: Acaia Connected
#      id: acaia_connected
#      internal: true
# Uncomment if using Stream server
  - platform: stream_server
    connected:
      name: UART Bridge connected
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 70
      internal: true
      on_press:
        then:
          - open_lcc.bianca.disable: lcc_1
      on_release:
        then:
          - open_lcc.bianca.enable: lcc_1
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
      mode:
        input: true
        pullup: true
    # [MOD] Short and long press separated. Short is the temperature in normal
    # operation as before, paging or the value inside the menu; long opens the
    # menu and triggers its entry. The price: the temperature now changes on
    # release, because only then is the press duration known.
    on_click:
      - min_length: 30ms
        max_length: 500ms
        then:
          # [MOD] Match the original LCC panel: Plus/Minus end sleep mode
          # instead of doing their normal function while asleep.
          - if:
              condition:
                switch.is_on: sleep_mode_sw
              then:
                - switch.turn_off: sleep_mode_sw
              else:
                - if:
                    condition:
                      lambda: 'return id(ui_state) == 0;'
                    then:
                      - number.increment:
                          id: coffee_set_point
                          cycle: false
                      - lambda: 'id(ui_last_ms) = millis();'
                    else:
                      - script.execute:
                          id: ui_short
                          dir: 1
      - min_length: 500ms
        max_length: 20000ms
        then:
          - if:
              condition:
                switch.is_on: sleep_mode_sw
              then:
                - switch.turn_off: sleep_mode_sw
              else:
                - script.execute: ui_long
    internal: true
    name: "Plus button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 80
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - min_length: 30ms
        max_length: 500ms
        then:
          # [MOD] Match the original LCC panel: Plus/Minus end sleep mode
          # instead of doing their normal function while asleep.
          - if:
              condition:
                switch.is_on: sleep_mode_sw
              then:
                - switch.turn_off: sleep_mode_sw
              else:
                - if:
                    condition:
                      lambda: 'return id(ui_state) == 0;'
                    then:
                      - number.decrement:
                          id: coffee_set_point
                          cycle: false
                      - lambda: 'id(ui_last_ms) = millis();'
                    else:
                      - script.execute:
                          id: ui_short
                          dir: -1
      - min_length: 500ms
        max_length: 20000ms
        then:
          - if:
              condition:
                switch.is_on: sleep_mode_sw
              then:
                - switch.turn_off: sleep_mode_sw
              else:
                - script.execute: ui_long
    internal: true
    name: "Minus button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 90

button:
  - platform: template
    name: "Reboot RP2040 to BOOTSEL"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 110
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_bootsel_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_bootsel_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Reboot RP2040 to Serial Boot"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 100
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_serial_boot_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_serial_boot_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Enqueue Routine"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 40
    on_press:
      - open_lcc.bianca.enqueue_routine: lcc_1
  # [MOD] Only the resettable counter, the total one stays untouched
  - platform: template
    name: "Reset Shot Counter"
    icon: "mdi:counter"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 40
    entity_category: "config"
    on_press:
      - lambda: 'id(shots_reset) = 0;'
      - component.update: shots_reset_sens

number:
  - platform: open_lcc_bianca
    coffee_boiler_temperature_offset:
      id: bbto
      name: Coffee Boiler Temperature Offset
      icon: "mdi:tune"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 10
      mode: box
      entity_category: "config"
    auto_sleep_after:
      id: asa
      name: Auto Sleep After
      icon: "mdi:sleep"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 20
      mode: box
      entity_category: "config"
    coffee_boiler_temperature_set_point:
      id: coffee_set_point
      name: Coffee boiler set point
      icon: "mdi:target"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 30
      mode: box
    service_boiler_temperature_set_point:
      id: service_set_point
      name: Service boiler set point
      icon: "mdi:target"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 50
      mode: box
  # [MOD] Calibration frame only: inset of the single rectangle from the edge.
  # Raise it until an edge becomes visible - the value is shown large.
  - platform: template
    name: "Calibration Inset"
    icon: "mdi:arrow-expand-all"
    id: calib_inset
    min_value: 0
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: "config"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
  # [MOD] First phase of the pre-infusion: this is how long the pump runs and
  # builds pressure before it cuts out for the pause. 0 = pause at once, i.e.
  # the previous behaviour.
  - platform: template
    name: "Pre-Infusion Pressure Time"
    icon: "mdi:timer-play-outline"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 25
    id: preinf_press_time
    min_value: 0
    max_value: 15
    step: 0.5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: "config"
  # [MOD] Second phase: this is how long the pump stays off. The entity name
  # deliberately stays "Pre-Infusion Time" - a new name would change the
  # entity_id and break references in Home Assistant. In the menu: "Pause".
  - platform: template
    name: "Pre-Infusion Time"
    icon: "mdi:timer-outline"
    web_server:
      sorting_group_id: grp_preinf
      sorting_weight: 30
    id: preinf_time
    min_value: 0
    max_value: 15
    step: 0.5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: "config"
  # [MOD] A brew counts from this duration on - keeps flushes out
  - platform: template
    name: "Minimum Shot Duration"
    icon: "mdi:timer-cog-outline"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 30
    id: shot_min_s
    min_value: 0
    max_value: 20
    step: 1
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: "config"

sensor:
  - platform: open_lcc_bianca
    coffee_boiler_temperature:
      name: Coffee Boiler Temperature
      icon: "mdi:coffee-maker"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 20
      id: coffee_boiler_sens
    service_boiler_temperature:
      name: Service Boiler Temperature
      icon: "mdi:kettle-steam"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 40
      id: service_boiler_sens
    external_temperature_1:
      name: E61 Outlet Temperature
      icon: "mdi:thermometer"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 40
      id: outlet_temp_sens
      # [MOD] internal: without an MCP9600 converter both sit at 0 permanently.
      # They stay visible under Diagnostics in the web interface but no
      # longer appear in Home Assistant.
      internal: true
    external_temperature_2:
      name: E61 Inlet Temperature
      icon: "mdi:thermometer"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 50
      id: inlet_temp_sens
      internal: true
    auto_sleep_in:
      name: Auto-sleep in
      icon: "mdi:timer-sand"
      web_server:
        sorting_group_id: grp_config
        sorting_weight: 30
      unit_of_measurement: "min"
      accuracy_decimals: 0
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    current_routine:
      name: Currently Loaded Routine ID
      icon: "mdi:script-text-play"
      web_server:
        sorting_group_id: grp_preinf
        sorting_weight: 50
    current_routine_step:
      name: Current Routine Step
      icon: "mdi:debug-step-over"
      web_server:
        sorting_group_id: grp_preinf
        sorting_weight: 60
    rp2040_uptime:
      id: rp2040_up
      name: RP2040 Uptime
      icon: "mdi:timer-outline"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 20
      unit_of_measurement: "min"
      accuracy_decimals: 0
      entity_category: "diagnostic"
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    brew_time:
      name: Brew time
      icon: "mdi:timer-outline"
      web_server:
        sorting_group_id: grp_betrieb
        sorting_weight: 60
      id: brew_time
# Uncomment if using Acaia
#  - platform: acaia
#    weight:
#      id: scale_sens
#      name: Scale weight
#      accuracy_decimals: 1
#      unit_of_measurement: g
#      filters:
#        - lambda: return x * 1000;
#    flow:
#      name: Scale flow
#      id: flow_sens
# Uncomment if using Pressensor
#  - platform: pressensor
#    pressure:
#      id: pressure_sens
#      name: Group Pressure
#      accuracy_decimals: 1
#      unit_of_measurement: bar
#      filters:
#        - lambda: return x / 100000;
#    battery_level:
#      name: Pressensor Battery Level
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 30
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  # [MOD] Shot counters. update_interval 60s as a safety net; on top of that it
  # is published immediately after every brew via component.update.
  - platform: template
    name: "Shots Total"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 10
    id: shots_total_sens
    accuracy_decimals: 0
    icon: "mdi:coffee"
    state_class: "total_increasing"
    update_interval: 60s
    lambda: 'return (float) id(shots_total);'
  - platform: template
    name: "Shots Since Reset"
    web_server:
      sorting_group_id: grp_zaehler
      sorting_weight: 20
    id: shots_reset_sens
    accuracy_decimals: 0
    icon: "mdi:coffee-outline"
    update_interval: 60s
    lambda: 'return (float) id(shots_reset);'
  - platform: uptime
    id: esp32_up
    name: "ESP32 Uptime"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 10
    unit_of_measurement: "min"
    accuracy_decimals: 0
    filters:
      - lambda: return x / 60;
      - or:
          - throttle: 60s
          - delta: 0.45
    entity_category: "diagnostic"

# Enable Home Assistant API
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

captive_portal:

web_server:
  port: 80
  ota: false # Not available in IDF
  log: true          # [MOD] Log column on the right, toggled by double-click
  include_internal: true
  # [MOD] Version 3 instead of the default 2: card layout with groups instead
  # of an alphabetically sorted table. sorting_groups only exists in v3.
  version: 3
  # [MOD] Group names in English - like all entity names. The IDs stay German,
  # they are internal only and never show up in the interface.
  sorting_groups:
    - id: grp_betrieb
      name: "Operation"
      sorting_weight: 10
    - id: grp_preinf
      name: "Pre-Infusion"
      sorting_weight: 20
    - id: grp_zaehler
      name: "Shot Counter"
      sorting_weight: 30
    - id: grp_menu
      name: "Display Menu"
      sorting_weight: 35
    - id: grp_config
      name: "Settings"
      sorting_weight: 40
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 50

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

i2c:
  sda: 2
  scl: 1
  scan: true
  id: qwiic_3

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: dark_gray
    red: 20%
    green: 20%
    blue: 20%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: white
    red: 100%
    green: 100%
    blue: 100%
  - id: black
    red: 0%
    green: 0%
    blue: 0%
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font12
    size: 24
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font36
    size: 48
  - file: "open-lcc/9x15.bdf"
    id: font2
  - file: "open-lcc/5x7.bdf"
    id: font1
  # [MOD] Large digits for the OLED. Roboto renders digits at about 0.7 x size.
  #       glyphs limits the character set and saves flash.
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_num
    size: 30
    glyphs: "0123456789.-°"
  - file:
      type: gfonts
      family: Roboto
      # [MOD] Weight 400 instead of 900: Roboto Black looked too heavy on the
      # small display. Size 34 is enough for the measured window.
      weight: 400
    id: font_timer
    size: 34
    glyphs: "0123456789.OK"
  # [MOD] Medium-size capitals for the water warning. Size 14 is deliberately
  # conservative: "WASSER" needs about 59 px, the field next to the 16x16
  # symbol has 69. glyphs holds only the six letters occurring in "WATER"
  # and "WASSER".
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_warn
    size: 14
    glyphs: "AERSTW"


# ESPHome >= 2025 requires 'type:' per image; BINARY = 1-bit, right for a mono OLED
image:
  - file: "open-lcc/xbm/pump_on_2x.h"
    id: pump_on
    type: BINARY
  # [MOD] 8x8 variants for the OLED - the 2x images (16x16) were meant for
  #       the TFT and overlap inside the small visible window
  - file: "open-lcc/xbm/pump_on.h"
    id: pump_1x
    type: BINARY
  # [MOD] Coffee cup, 32x32. cup_steam_a/b are the two steam frames the
  # display alternates between while brewing.
  - file: "open-lcc/xbm/cup_no_smoke.h"
    id: cup_still
    type: BINARY
  - file: "open-lcc/xbm/cup_smoke_1.h"
    id: cup_steam_a
    type: BINARY
  - file: "open-lcc/xbm/cup_smoke_2.h"
    id: cup_steam_b
    type: BINARY
  # [MOD] 7x7 boiler symbols instead of the letters B and S
  - file: "open-lcc/xbm/bssr_on.h"
    id: bssr_1x
    type: BINARY
  - file: "open-lcc/xbm/sssr_on.h"
    id: sssr_1x
    type: BINARY
  - file: "open-lcc/xbm/no_water.h"
    id: no_water_1x
    type: BINARY
  - file: "open-lcc/xbm/no_water_2x.h"
    id: no_water
    type: BINARY
  - file: "open-lcc/xbm/eco_mode_2x.h"
    id: eco_mode
    type: BINARY
  - file: "open-lcc/xbm/bssr_on_2x.h"
    id: bssr_on
    type: BINARY
  - file: "open-lcc/xbm/sssr_on_2x.h"
    id: sssr_on
    type: BINARY

