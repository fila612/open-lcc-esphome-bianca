#          // it.printf(40, 125, id(font12), "%.0f s, %.1f bar, %.1f g/s", id(brew_time).state, id(pressure_sens).state, id(flow_sens).state);

# SSD1306

# (color: white/black already defined in the main color: block above, no need to redefine)

# [MOD] Completely new OLED layout.
# Visible window inside the Bianca case: roughly x 16..105, y 16..53.
# Everything outside it is hidden by the case - hence the 16/16 offset.
display:
  - platform: ssd1306_spi
    id: my_oled          # [MOD] needed to switch the panel off in sleep mode
    update_interval: 0.5s
    model: "SSD1306 128x64"
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    rotation: 180°
    lambda: |-
      // Visible window measured with the calibration frame on 2026-09-05:
      //   x 15..110, y 14..63  (96 x 50 Pixel)
      // Innenrand 2 px ringsum  ->  Inhaltsbereich x 17..108, y 16..61.
      // All coordinates below refer to that.

      if (id(calib_sw).state) {
        int n = (int) id(calib_inset).state;
        it.rectangle(n, n, 128 - 2 * n, 64 - 2 * n);
        it.printf(64, 40, id(font_num), TextAlign::BASELINE_CENTER, "%d", n);
        return;
      }

      // [MOD] Button menu. While it is open, only the menu is drawn.
      // One page per value - a list would not be legible in the 96x50 window.
      // Header at y 16, label at y 27, value on baseline 54.
      if (id(ui_state) != 0) {
        auto mli = id(lang_sel).active_index();
        bool mde = mli.has_value() && mli.value() == 1;
        const uint8_t p = id(ui_page);
        const uint8_t lv = id(ui_level);
        const bool sub = (lv != 0);
        const bool edit = (id(ui_state) == 2);

        // Position on the right. At top level hidden entries do not count,
        // otherwise it would read 3/7 with five reachable; below it is four.
        int idx = 0, tot = 0;
        if (sub) {
          tot = (lv == 1) ? 4 : 3;
          idx = p + 1;
        } else {
          for (int i = 0; i < 7; i++) {
            if ((id(menu_mask) >> i) & 1) {
              tot++;
              if (i == p) idx = tot;
            }
          }
        }
        const char *head;
        if (edit)         head = mde ? "WERT" : "EDIT";
        else if (lv == 1) head = mde ? "PRAEINF" : "PRE-INF";
        else if (lv == 2) head = mde ? "SCHLAF" : "SLEEP";
        else              head = "MENU";
        it.print(17, 16, id(font1), head);
        it.printf(108, 16, id(font1), TextAlign::TOP_RIGHT, "%d/%d", idx, tot);

        const char *lbl;
        if (lv == 1) {
          switch (p) {
            case 0:  lbl = mde ? "AKTIV"     : "ACTIVE";    break;
            case 1:  lbl = mde ? "MODUS"     : "MODE";      break;
            case 2:  lbl = mde ? "DRUCK"     : "PRESSURE";  break;
            case 3:  lbl = "PAUSE";                         break;
            default: lbl = mde ? "ZURUECK"   : "BACK";      break;
          }
        } else if (lv == 2) {
          switch (p) {
            case 0:  lbl = mde ? "AKTIV"     : "ACTIVE";     break;
            case 1:  lbl = mde ? "AUTO NACH" : "AUTO AFTER"; break;
            default: lbl = mde ? "ZURUECK"   : "BACK";      break;
          }
        } else {
          switch (p) {
            case 0:  lbl = mde ? "PRAEINFUSION" : "PRE-INFUSION"; break;
            case 1:  lbl = mde ? "DAMPF"        : "STEAM";        break;
            case 2:  lbl = mde ? "ECO-MODUS"    : "ECO MODE";     break;
            case 3:  lbl = mde ? "SPRACHE"      : "LANGUAGE";     break;
            case 4:  lbl = mde ? "BEZUEGE"      : "SHOTS";        break;
            case 5:  lbl = mde ? "SCHLAF"       : "SLEEP";        break;
            default: lbl = mde ? "ZURUECK"      : "EXIT";         break;
          }
        }
        it.print(17, 27, id(font1), lbl);

        // The right of the label line says what a long press does here -
        // otherwise you have to find out by trying. ">" leads one level
        // deeper, the double arrow changes this page's value (toggle it, or
        // open editing). In edit mode it disappears, because there
        // the two button marks next to the value already say everything.
        // Deliberately unmarked: "Back" and the shot counter - a long press
        // there resets the counter, and that should not be discovered by
        // accident.
        if (lv == 0 && (p == 0 || p == 5)) {
          it.print(108, 27, id(font1), TextAlign::TOP_RIGHT, ">");
        } else if (!edit && ((lv == 0 && p >= 1 && p <= 3) ||
                             (lv == 1 && p <= 3) ||
                             (lv == 2 && p <= 1))) {
          it.line(99, 30, 108, 30);
          it.line(99, 30, 102, 27);
          it.line(99, 30, 102, 33);
          it.line(108, 30, 105, 27);
          it.line(108, 30, 105, 33);
        }

        // In edit mode the two marks name the buttons. Deliberately no
        // inverted area - the value should look the same as everywhere else.
        // Position and width of the drawn value. The button marks attach
        // to it further down - so they sit next to the number, not at the edge.
        int blkX = 17, blkW = 92;

        // Number pages: value large, unit small beside it, centred as one
        // block. font_num has no letters, so the "s" comes from font1.
        float num = -1.0f;
        const char *unit = "";
        if (lv == 1 && p == 2)      { num = id(preinf_press_time).state; unit = "s"; }
        else if (lv == 1 && p == 3) { num = id(preinf_time).state;       unit = "s"; }
        else if (lv == 0 && p == 1) { num = id(service_set_point).state; unit = "°"; }
        else if (lv == 0 && p == 4) { num = (float) id(shots_reset);     unit = "";  }
        // Auto-sleep: 0 means switched off and is shown as a word.
        else if (lv == 2 && p == 1 && !std::isnan(id(asa).state) &&
                 id(asa).state > 0) { num = id(asa).state;              unit = "m"; }
        // The "Sleep" entry above summarises what is set behind it - the
        // auto-sleep time. Whether the machine is asleep right now is
        // already in the header of the main screen ("Schlaf" / "Sleep").
        else if (lv == 0 && p == 5 && !std::isnan(id(asa).state) &&
                 id(asa).state > 0) { num = id(asa).state;              unit = "m"; }

        // The back pages get an arrow instead of a second word -
        // "ZURUECK" already stands in the label line above.
        const bool isBack = (lv == 0 && p == 6) || (lv == 1 && p == 4) ||
                            (lv == 2 && p == 2);
        if (isBack) {
          it.line(50, 45, 74, 45);
          it.line(50, 46, 74, 46);
          it.line(50, 45, 57, 38);
          it.line(50, 46, 57, 53);
        } else if (num >= 0.0f) {
          std::string nb = str_sprintf("%.0f", num);
          int tx, ty, tw, th;
          it.get_text_bounds(0, 0, nb.c_str(), id(font_num),
                             TextAlign::BASELINE_LEFT, &tx, &ty, &tw, &th);
          // ty is the distance from the top edge to the baseline, and negative.
          // The baseline is computed from it instead of being fixed - otherwise
          // the digits reach into the label line above. A top edge of 36 leaves
          // two pixels of air to the label, which ends at 33.
          int base = 36 - ty;
          if (base > 61) base = 61;
          int uw = (unit[0] == 0) ? 0 : 6;
          int total = tw + (uw ? 3 + uw : 0);
          int x0 = 17 + (92 - total) / 2;
          if (x0 < 17) x0 = 17;
          it.print(x0, base, id(font_num), TextAlign::BASELINE_LEFT, nb.c_str());
          if (uw) it.print(x0 + tw + 3, base - 7, id(font1), unit);
          blkX = x0;
          blkW = total;
        } else {
          // The "Pre-infusion" entry shows its state one level up already -
          // no need to go a level deeper for that.
          const char *w;
          const char *ON  = mde ? "EIN" : "ON";
          const char *OFF = mde ? "AUS" : "OFF";
          if (lv == 2 && p == 0)      w = id(sleep_mode_sw).state ? ON : OFF;
          // No value is something other than "off" - hence "?" instead of "OFF".
          // If a question mark shows, the RP2040 is not reporting the value.
          else if (lv == 2 && p == 1) w = std::isnan(id(asa).state) ? "?" : OFF;
          else if (lv == 1 && p == 1) {
            // Index 0 = fixed firmware times, 1 = the two menu values
            auto mi = id(preinf_mode).active_index();
            bool preset = !mi.has_value() || mi.value() == 0;
            w = preset ? (mde ? "VORGABE" : "PRESET")
                       : (mde ? "EIGENE"  : "CUSTOM");
          }
          else if (p == 0)            w = id(preinf_on).state ? ON : OFF;
          else if (lv == 0 && p == 2) w = id(eco_mode_sw).state ? ON : OFF;
          else if (lv == 0 && p == 3) w = mde ? "DE" : "EN";
          else if (lv == 0 && p == 5) w = std::isnan(id(asa).state) ? "?" : OFF;
          else                        w = "";
          if (w[0] != 0) {
            int wx, wy, ww, wh;
            it.get_text_bounds(62, 40, w, id(font2), TextAlign::TOP_CENTER,
                               &wx, &wy, &ww, &wh);
            it.print(62, 40, id(font2), TextAlign::TOP_CENTER, w);
            blkX = wx;
            blkW = ww;
          }
        }

        // [MOD] Plus and minus drawn instead of printed: in the 5x7 font the
        // minus is only a thin dash, and at the case edge both looked stuck
        // on. Bars 11 x 3, vertically centred on the value, seven pixels
        // beside it - pushed to the edge only when it will not fit.
        if (edit) {
          const int cy = 47;
          int lx = blkX - 12;
          int rx = blkX + blkW + 12;
          if (lx - 5 < 17)  lx = 22;
          if (rx + 5 > 108) rx = 103;
          it.filled_rectangle(lx - 5, cy - 1, 11, 3);
          it.filled_rectangle(rx - 5, cy - 1, 11, 3);
          it.filled_rectangle(rx - 1, cy - 5, 3, 11);
        }
        return;
      }

      // [MOD] The brew switch reports "brewing" even when the firmware does
      // not let the pump start because the tank is empty. The timer therefore
      // hangs on shot_valid, not on the raw switch signal - otherwise it
      // would happily count up during a test with an empty tank.
      bool show_timer = (id(brewing).state && !id(water_low_sens).state) ||
                        (id(shot_valid) && id(brew_end_ms) > 0 &&
                         (millis() - id(brew_end_ms)) < 5000);
      bool show_ok = !show_timer && id(warm_ok_ms) > 0 &&
                     (millis() - id(warm_ok_ms)) < 2000;
      bool warm = (id(status).state == "Warm");

      // [MOD] Language of the display texts. Index 0 = English, 1 = German.
      // active_index() returns an optional; in doubt it falls back to
      // English, so no empty text is ever left standing.
      auto li = id(lang_sel).active_index();
      bool de = li.has_value() && li.value() == 1;

      if (show_ok) {
        // Heat-up finished: same imagery as brewing, cup without steam
        it.print(17, 16, id(font1), de ? "BEREIT" : "READY");
        it.printf(108, 16, id(font1), TextAlign::TOP_RIGHT, "%.1f°", id(coffee_boiler_sens).state);
        it.image(17, 27, id(cup_still), id(white), id(black));
        it.print(79, 55, id(font_timer), TextAlign::BASELINE_CENTER, "OK");

      } else if (show_timer) {
        // Brewing: the cup alternates between the two steam frames
        it.printf(17, 16, id(font1), "%.1f°", id(coffee_boiler_sens).state);
        it.print(108, 16, id(font1), TextAlign::TOP_RIGHT, de ? "SEK" : "SEC");
        // Cup (32 px tall) centred in the area below the header: 24..61
        // gives a top edge of 27. The seconds sit on the same centre line
        // and are centred in the field right of the cup - so the number
        // does not jump when it goes from one digit to two.
        if (((millis() / 430) % 2) == 0) {
          it.image(17, 27, id(cup_steam_a), id(white), id(black));
        } else {
          it.image(17, 27, id(cup_steam_b), id(white), id(black));
        }
        it.printf(79, 55, id(font_timer), TextAlign::BASELINE_CENTER, "%.0f", id(brew_time).state);

      } else {
        // Header: status on the left, state symbols on the right - only when
        // they mean something. rx walks right to left so no gaps appear.
        // The firmware raw text is too long: "Temperatures normalizing"
        // would be 24 chars x 6 px = 144 px, the window has only 96.
        // Hence short forms. The longest is "First run" with 9 chars
        // = 54 px, ending at x 71; the first symbol starts at x 80 at the
        // earliest. Up to 16 chars it stays clear of the right edge.
        // "Warm" is the firmware raw text; "Ready" is shown because that
        // is the actual state - the machine is ready to brew.
        const char *st = "?";
        std::string lcc = id(status).state;
        if      (lcc == "Warm")                     st = de ? "Bereit" : "Ready";
        else if (lcc == "Heatup")                   st = de ? "Heizt"  : "Heating";
        else if (lcc == "Temperatures normalizing") st = de ? "Regelt" : "Settling";
        else if (lcc == "Sleeping")                 st = de ? "Schlaf" : "Sleep";
        else if (lcc == "Bailed")                   st = "STOP";
        else if (lcc == "First run")                st = de ? "Start"  : "First run";
        it.print(17, 16, id(font1), st);
        int rx = 108;
        if (id(brew_boiler_on).state) {
          it.image(rx - 6, 17, id(bssr_1x), id(white), id(black));
          rx -= 10;
        } else if (id(service_boiler_on).state) {
          it.image(rx - 6, 17, id(sssr_1x), id(white), id(black));
          rx -= 10;
        }
        if (id(filling_service_boiler_sens).state) {
          it.image(rx - 7, 16, id(pump_1x), id(white), id(black));
        }
        // The 8x8 water symbol in the header is dropped - with an empty tank
        // the warning stands large in the middle and need not appear twice.

        if (id(water_low_sens).state) {
          // Water tank empty: the large temperature gives way to the warning.
          // 16x16 symbol (no_water_2x) instead of the 8x8 one, word beside it.
          // The width of the word is measured, not guessed -
          // "WASSER" is much wider than "WATER", and a fixed x position
          // would always be wrong for one of the two.
          const char *wtxt = de ? "WASSER" : "WATER";
          int tx, ty, tw, th;
          it.get_text_bounds(0, 0, wtxt, id(font_warn), TextAlign::BASELINE_LEFT,
                             &tx, &ty, &tw, &th);
          const int gap = 6;
          int bx = 17 + (92 - (16 + gap + tw)) / 2;   // Block waagerecht zentrieren
          if (bx < 17) bx = 17;                       // Notbremse, falls doch zu breit
          // Vertically: symbol 31..46, baseline 44 - both centres sit at 39
          it.image(bx, 31, id(no_water), id(white), id(black));
          it.print(bx + 16 + gap, 44, id(font_warn), TextAlign::BASELINE_LEFT, wtxt);
          // Footer left: the actual value now - the set point does not help
          // while brewing is impossible anyway.
          it.printf(17, 55, id(font1), "%.1f°", id(coffee_boiler_sens).state);

        } else {
          // Brew temperature large. Baseline 50 centres the roughly 21 px
          // digits in the field 23..54 between header and footer.
          it.printf(17, 50, id(font_num), TextAlign::BASELINE_LEFT, "%.1f°",
                    id(coffee_boiler_sens).state);

          // Footer: the set point on the left - directly under its actual
          // value, hence unlabelled. Blinks once a second while not "Warm".
          if (warm || ((millis() / 1000) % 2) == 0) {
            it.printf(17, 55, id(font1), "%.1f", id(coffee_set_point).state);
          }
        }
        // Steam boiler on the right, or the Eco note instead
        if (id(eco_mode_sw).state) {
          it.print(108, 55, id(font1), TextAlign::TOP_RIGHT, "Eco");
        } else {
          it.printf(108, 55, id(font1), TextAlign::TOP_RIGHT, "S %.0f°",
                    id(service_boiler_sens).state);
        }
      }
